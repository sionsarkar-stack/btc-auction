server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:${BTC_AUCTION_DB_PATH:/opt/btc-auction/data/btcdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_USERNAME:sa}
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always

spring.h2.console.enabled=false

btc.auction.admin.username=${BTC_AUCTION_ADMIN_USERNAME:auctioneer}
btc.auction.admin.password=${BTC_AUCTION_ADMIN_PASSWORD}
btc.auction.viewer.password=${BTC_AUCTION_VIEWER_PASSWORD}
btc.auction.public-origin=${BTC_AUCTION_PUBLIC_ORIGIN:https://15.252.91.98}
